name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Stage 0: Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Stage 1: PHP Setup & Tests
      # -------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.xml

      # -------------------------
      # Stage 2: Docker Image Scan
      # -------------------------
      - name: Build Docker image
        run: docker build -t secure-todo-app:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: secure-todo-app:latest
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # -------------------------
      # Stage 3: Push Docker Image
      # -------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag secure-todo-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/secure-todo-app:${{ github.sha }}
          docker tag secure-todo-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/secure-todo-app:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secure-todo-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/secure-todo-app:latest
